experiment: phase2b_pilot_sft_408
student_model: unsloth/Qwen3-VL-4B-Instruct-unsloth-bnb-4bit
training:
  source_dataset: phase2a_pilot_500_v3_train_clean.jsonl
  source_split: ChartQA_train_only
  records: 408
  epochs: 2
  optimizer_steps: 102
  learning_rate: 0.0001
  lora:
    r: 16
    alpha: 16
    dropout: 0.0
  phase1_validation_used_for_training: false
evaluation:
  dataset: HuggingFaceM4/ChartQA
  split: val
  frozen_indices: "0:500"
  metric: deterministic_exact_or_numeric_match
  preliminary_sft_accuracy: 0.69
  baseline_accuracy: 0.634
  caveat: "The preliminary SFT run used a different generation prompt and max_new_tokens from Phase 1; rerun with the exact frozen protocol before final comparison."
artifacts:
  local_only:
    - results/vali/sft_val_500.csv
    - adapter
    - checkpoints
    - training_metrics
